name: Update Meetup data
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scraper (exits non-zero without touching data on failure/empty)
        run: python3 scripts/update_meetup.py
      - name: Commit data if changed
        id: commit
        run: |
          # ignore the "generated" timestamp alone: compare everything else
          if git diff --quiet -I '"generated":' -- site/data; then
            git checkout -- site/data
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update Meetup data [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # GITHUB_TOKEN pushes don't trigger other workflows, so deploy inline.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
