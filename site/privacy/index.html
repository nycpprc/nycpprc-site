<!doctype html>
<html lang="en">
<head>
<!--
  Whole-site redirect to the NYCPPRC group on Gnosis Events.
  GitHub Pages cannot emit an HTTP 301 for this content, so this file
  uses a 0-second meta refresh (search engines treat delay 0 as a
  permanent redirect) and location.replace. www.nycpprc.org still HTTP
  301s to the apex (nycpprc.org) before this page runs.
  The earlier index.html note that said not to redirect to gnosis.events
  is superseded: every page, including this one, now goes to the group URL.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to Gnosis Events</title>
<link rel="canonical" href="https://gnosis.events/g/reading-philosophy">
<meta http-equiv="refresh" content="0; url=https://gnosis.events/g/reading-philosophy">
<script>location.replace("https://gnosis.events/g/reading-philosophy");</script>
</head>
<body>
<p><a href="https://gnosis.events/g/reading-philosophy">https://gnosis.events/g/reading-philosophy</a></p>
</body>
</html>
