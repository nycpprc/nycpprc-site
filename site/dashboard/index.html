<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Site Stats</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<section id="login" class="hidden">
  <div class="card login-card">
    <h1>Site Stats</h1>
    <p class="muted">Sign in to view analytics.</p>
    <button id="google-btn" class="btn btn-outline">Continue with Google</button>
    <div class="or">or</div>
    <form id="magic-form">
      <input id="email" type="email" placeholder="you@example.com" required>
      <button class="btn" type="submit">Email me a link</button>
    </form>
    <p id="login-msg" class="muted small"></p>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div class="brand">Site Stats</div>
    <div class="seg" id="site-switch"></div>
    <div class="seg" id="range-switch">
      <button data-days="7">7d</button><button data-days="28" class="on">28d</button><button data-days="90">90d</button>
    </div>
    <div class="user"><span id="user-email" class="muted small"></span><button id="logout" class="btn btn-link">Sign out</button></div>
  </header>
  <main>
    <p id="status" class="muted small"></p>
    <div class="kpis" id="kpis"></div>
    <div class="card wide"><h2>Visitors, sessions &amp; views</h2><div class="chart-lg"><canvas id="c-series"></canvas></div></div>
    <div class="grid2">
      <div class="card"><h2>Traffic sources</h2><div class="chart"><canvas id="c-sources"></canvas></div></div>
      <div class="card"><h2>Countries</h2><div class="chart"><canvas id="c-countries"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Top pages</h2><table id="t-pages"><thead><tr><th>Page</th><th>Views</th><th>Users</th></tr></thead><tbody></tbody></table></div>
      <div class="card"><h2>Key events</h2><div class="chart"><canvas id="c-events"></canvas></div></div>
    </div>
  </main>
</section>
<script src="app.js"></script>
</body>
</html>
