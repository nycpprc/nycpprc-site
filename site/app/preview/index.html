    <script>
      (function () {
        var badge = document.getElementById("nycpprc-beta");
        if (!badge) return;
        function onPreview() {
          var path = location.pathname.replace(/\/+$/, "") || "/";
          return path === "/app/preview";
        }
        function visible(el) {
          if (!el) return false;
          var r = el.getBoundingClientRect();
          return r.width > 8 && r.height > 8;
        }
        function wordmark() {
          var root = document.getElementById("root");
          if (!root) return null;
          var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          var node;
          while ((node = walker.nextNode())) {
            var value = node.nodeValue || "";
            if (value.indexOf("NYC Philosophy") !== -1 && value.indexOf("Readers") === -1) {
              var el = node.parentElement;
              if (visible(el)) return el;
            }
          }
          return null;
        }
        function logo() {
          var root = document.getElementById("root");
          if (!root) return null;
          var nodes = root.querySelectorAll("[aria-label='NYCPPRC']");
          for (var i = 0; i < nodes.length; i++) {
            if (visible(nodes[i]) && nodes[i].getBoundingClientRect().height < 80) return nodes[i];
          }
          return null;
        }
        function place() {
          if (!onPreview()) {
            badge.hidden = true;
            return;
          }
          var anchor = wordmark() || logo();
          if (!anchor) {
            badge.hidden = true;
            return;
          }
          badge.hidden = false;
          var r = anchor.getBoundingClientRect();
          var top = r.top + (r.height - badge.offsetHeight) / 2;
          var left = r.right + 8;
          if (left + badge.offsetWidth > window.innerWidth - 12) {
            left = Math.max(12, window.innerWidth - badge.offsetWidth - 12);
            top = Math.max(8, r.top + 6);
          }
          badge.style.top = Math.max(8, top) + "px";
          badge.style.left = Math.max(8, left) + "px";
        }
        var scheduled = false;
        function schedule() {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(function () {
            scheduled = false;
            place();
          });
        }
        var push = history.pushState;
        var replace = history.replaceState;
        history.pushState = function () {
          var result = push.apply(this, arguments);
          schedule();
          return result;
        };
        history.replaceState = function () {
          var result = replace.apply(this, arguments);
          schedule();
          return result;
        };
        window.addEventListener("popstate", schedule);
        window.addEventListener("resize", schedule);
        var root = document.getElementById("root");
        if (root && window.MutationObserver) {
          new MutationObserver(schedule).observe(root, { childList: true, subtree: true, characterData: true });
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
        schedule();
      })();
    </script>
