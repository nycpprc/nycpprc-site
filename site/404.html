<title>Page not found · NYCPPRC</title>
<script>
// Unknown /app/** paths are the old members app. GitHub Pages serves this file for them.
// Hand the path to Gnosis Events instead of bouncing back into /app/.
(function(){
  var l=location, path=l.pathname;
  if(path.indexOf('/app/')!==0) return;
  var rest=path.slice('/app'.length)||'/';
  if(rest==='/rooms'||rest==='/rooms/') rest='/chat';
  if(rest==='/sign-up'||rest==='/sign-up/'||rest==='/login'||rest==='/login/') rest='/sign-in';
  l.replace('https://gnosis.events'+rest+l.search+l.hash);
})();
</script>
